name: JobDots checks
on:
  pull_request:
  push:
    branches: [main, jobdots]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tool-cache/playwright
      JOBPILOT_TEST_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json
      - name: PDF libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-liberation
      - name: Backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.lock
          backend/.venv/bin/pip check
      - name: Offline backend checks
        working-directory: backend
        run: .venv/bin/python tests/run_offline.py
      - name: Frontend dependencies and checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=moderate
      # Frontend browser (E2E) tests are paused: the old suite targeted the JobPilot
      # landing page and Supabase magic-link login, and the UI is being rebuilt
      # (plan section 6). They return with the new screens.
      - name: Extension checks
        working-directory: extension
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run test:browser
          npm audit --audit-level=moderate
      - name: Backend vulnerability gate
        run: |
          python -m venv .tool-cache/audit
          .tool-cache/audit/bin/pip install pip-audit==2.10.1
          .tool-cache/audit/bin/pip-audit -r backend/requirements.lock --disable-pip --no-deps -f json -o .tool-cache/backend-audit.json || test -s .tool-cache/backend-audit.json
          python backend/scripts/check_audit.py .tool-cache/backend-audit.json
      - name: PostgreSQL migrations, worker recovery and synthetic restore
        run: backend/.venv/bin/python backend/scripts/check_database.py --worker-recovery
      - name: Linux release image
        run: |
          docker build -t jobpilot-release:check backend
          python backend/scripts/check_image.py jobpilot-release:check
      - name: Review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-artifacts
          path: |
            frontend/test-results
            .tool-cache/backend-audit.json
          retention-days: 7
