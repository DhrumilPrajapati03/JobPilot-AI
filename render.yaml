# Render Blueprint for JobPilot: the API (Docker web service) and the web app (static site).
# In Render: New → Blueprint → pick this repo. Fill in the secret values when prompted.
# Full walkthrough: DEPLOY.md

services:
  - type: web
    name: jobpilot-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: EMBEDDINGS_PROVIDER
        value: local
      - key: RESEND_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # The web app's URL, e.g. https://jobpilot-web.onrender.com (comma-separate several).
      - key: FRONTEND_URL
        sync: false
      - key: DEBUG
        value: "false"

  - type: web
    name: jobpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # The API's URL, e.g. https://jobpilot-api.onrender.com, and the same with wss:// for live progress.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_BASE_URL
        sync: false
