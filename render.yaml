# JobDots on Render (plan section 9, Phase B). Ready but not deployed: the laptop stack
# (compose.yaml) is the source of truth until you move (docs/runbook.md). Reviewed releases
# only (autoDeploy: false). Secrets are `sync: false` (set in the Render dashboard) or
# generated by Render; none live in this file. Replaces the JobPilot-era Supabase blueprint.
envVarGroups:
  - name: jobdots-backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: EXECUTION_MODE
        value: durable
      - key: USAGE_LIMITS_ENABLED
        value: "true"
      - key: FILE_STORAGE_DIR
        value: /var/data/files
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: OBSERVABILITY_TOKEN
        generateValue: true
      - key: DATABASE_URL          # Postgres with pgvector (Neon, or Render Postgres + `create extension vector`)
        sync: false
      - key: ENCRYPTION_KEY        # copy from the laptop's .env, or stored Google/extension secrets can't be read
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false

services:
  - type: web
    name: jobdots-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: python -m alembic upgrade head
    autoDeploy: false
    envVars:
      - fromGroup: jobdots-backend
    disk:
      name: jobdots-files
      mountPath: /var/data
      sizeGB: 5

  - type: worker
    name: jobdots-worker
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.workers.runner
    autoDeploy: false
    envVars:
      - fromGroup: jobdots-backend

  - type: worker
    name: jobdots-telegram
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.telegram.bot
    autoDeploy: false
    envVars:
      - fromGroup: jobdots-backend

  - type: web
    name: jobdots-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
