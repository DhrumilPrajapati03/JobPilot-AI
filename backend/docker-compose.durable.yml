# Local durable mode: docker compose -f docker-compose.durable.yml up --build
# Apply the Sprint 2 migration before starting. Uses hosted Supabase, no Redis.
services:
  api:
    build: .
    env_file: .env
    environment:
      EXECUTION_MODE: durable
    ports:
      - "8000:8000"
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      EXECUTION_MODE: durable
    command: ["python", "-m", "app.workers.runner"]
    restart: unless-stopped
    stop_grace_period: 120s
