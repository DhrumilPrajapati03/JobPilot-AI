# JobDots local stack (plan section 9, Phase A: everything on the laptop).
#
#   cp .env.example .env         set POSTGRES_PASSWORD, OWNER_EMAIL and OWNER_API_TOKEN once
#   docker compose up -d         db -> migrate (alembic upgrade head) -> api + worker
#   docker compose up -d db      only Postgres 17 + pgvector on 127.0.0.1:${POSTGRES_PORT:-55432}
#
# Provider keys (GROQ_API_KEY, ...) come from backend/.env when it exists; the values
# below override it so the containers always use the local database and owner auth.
# Ports bind to 127.0.0.1 only; nothing is reachable from the network.

name: jobdots

x-backend: &backend
  build: ./backend
  image: jobdots-backend:local
  env_file:
    - path: backend/.env
      required: false
  environment: &backend-env
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://jobdots:${POSTGRES_PASSWORD}@db:5432/jobdots
    EXECUTION_MODE: durable
    OWNER_EMAIL: ${OWNER_EMAIL:-}
    OWNER_API_TOKEN: ${OWNER_API_TOKEN:-}
    OWNER_ID: ${OWNER_ID:-}
  volumes:
    - files:/app/data/files
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    # Same image as backend/scripts/check_database.py; keep the two in step.
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobdots
      POSTGRES_DB: jobdots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jobdots -d jobdots"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  migrate:
    build: ./backend
    image: jobdots-backend:local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobdots:${POSTGRES_PASSWORD}@db:5432/jobdots
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.runner"]
    restart: unless-stopped
    stop_grace_period: 120s

volumes:
  pgdata:
  files:
